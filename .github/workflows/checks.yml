name: Checks
on: [push, pull_request]
jobs:
  backend-and-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kadena_earn
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: kadena_earn
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U kadena_earn"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://kadena_earn:local_test_only@127.0.0.1:55432/kadena_earn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install pinned Pact 5 interpreter
        run: |
          mkdir -p .local
          curl -fsSL https://github.com/kadena-io/pact-5/releases/download/5.4/pact-5.4-linux-x64.tar.gz -o .local/pact.tgz
          # The release publishes no checksum file; this is the SHA-256 of the 5.4 asset as downloaded Nov 3, 2026.
          # If the asset ever changes, this step fails instead of running an unknown binary.
          echo "251328d16af41388afbaf659ff484973f80119347df42d4491ea174ee6c3469d  .local/pact.tgz" | sha256sum -c -
          tar xzf .local/pact.tgz -C .local
      - run: npm run test:pact
