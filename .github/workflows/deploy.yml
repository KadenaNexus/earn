# https://earn.kadena.ws/: deploys main only after the Checks workflow (backend, contract and Pact tests) passes (see KadenaNexus/homepage docs/DEPLOY-STANDARD.md)
name: deploy
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    uses: KadenaNexus/homepage/.github/workflows/deploy-app.yml@main
    with:
      url: https://earn.kadena.ws/
    secrets: inherit
