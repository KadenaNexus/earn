name: deploy
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: write
    uses: KadenaNexus/homepage/.github/workflows/deploy-app.yml@main
    with:
      url: https://earn.kadena.ws/
    secrets: inherit
